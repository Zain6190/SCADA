services:
  # ── PostGIS Database ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: ibcp-postgis
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ibcp_scada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - scada-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibcp_scada"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Alembic Migration Service (one-shot) ─────────────────────────
  migration:
    build:
      context: ./services/aquavision-service
      dockerfile: Dockerfile
    container_name: ibcp-migration
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-1234}@db:5432/ibcp_scada
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    networks:
      - scada-net
    restart: "no"

  # ── AquaVision API ──────────────────────────────────────────────
  aquavision:
    build:
      context: ./services/aquavision-service
      dockerfile: Dockerfile
    container_name: ibcp-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-1234}@db:5432/ibcp_scada
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - scada-net
    volumes:
      - irsa-archive:/app/raw_archive
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8100/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── IRSA/FFD/ML Scheduler ──────────────────────────────────────
  scheduler:
    build:
      context: ./services/scheduler
      dockerfile: Dockerfile
    container_name: ibcp-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-1234}@db:5432/ibcp_scada
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - scada-net
    volumes:
      - irsa-archive:/app/raw_archive

  # ── Daily Database Backup ────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: ibcp-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-1234}
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-1234}@db:5432/ibcp_scada
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgbackups:/backups
    networks:
      - scada-net
    entrypoint: >
      sh -c '
        echo "Backup service started. Running daily at 02:00 UTC."
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          echo "[$$(date)] Starting backup: ibcp_scada_$$TIMESTAMP.sql.gz"
          pg_dump -h db -U postgres ibcp_scada --no-owner --no-privileges | gzip > /backups/ibcp_scada_$$TIMESTAMP.sql.gz
          if [ $$? -eq 0 ]; then
            echo "[$$(date)] Backup successful"
            # Keep only last 30 backups
            ls -1t /backups/ibcp_scada_*.sql.gz 2>/dev/null | tail -n +31 | xargs -r rm --
          else
            echo "[$$(date)] BACKUP FAILED"
          fi
          echo "[$$(date)] Next backup in 24 hours"
          sleep 86400
        done
      '

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    container_name: ibcp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://aquavision:8100
    depends_on:
      - aquavision
    networks:
      - scada-net

volumes:
  pgdata:
  pgbackups:
  irsa-archive:

networks:
  scada-net:
    driver: bridge
