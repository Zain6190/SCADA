services:
  # ── Local PostGIS (OPTIONAL fallback) ──────────────────────────────
  # Not required: DATABASE_URL in .env points at Neon by default.
  # Start it only for offline/local work and point DATABASE_URL at
  # postgresql://postgres:${POSTGRES_PASSWORD:-1234}@localhost:5433/ibcp_scada
  db:
    image: postgis/postgis:16-3.4
    container_name: ibcp-postgis
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ibcp_scada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - ibcp-pgdata:/var/lib/postgresql/data
    networks:
      - scada-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibcp_scada"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── AquaVision API (auto-setup: migrations + seed + ingest + train) ──
  aquavision:
    image: ibcp-scada-aquavision:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibcp-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      # Primary DB from .env (Neon). Plain psycopg2-compatible scheme so both
      # SQLAlchemy and psycopg2.connect() consumers work.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - copy .env.example to .env and set your Neon connection string}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      GEE_PROJECT: ${GEE_PROJECT:-}
    volumes:
      # Host is source of truth for trained models — container recreates
      # must not wipe them (retrain writes land here directly).
      - ./services/aquavision-service/models:/app/models
      # Classifiers + model_metadata.json live outside /app/models; without
      # this mount a rebuild wipes them (flood probability + registry metrics).
      - ./services/aquavision-service/data/models:/app/data/models
      # Earth Engine personal credentials (P5 GEE feature pipeline), read-only.
      - ${GEE_CREDENTIALS_DIR:-C:/Users/haris/.config/earthengine}:/root/.config/earthengine:ro
    networks:
      - scada-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── Scheduler (same image; runs scheduler.main instead of the API) ──
  scheduler:
    image: ibcp-scada-aquavision:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibcp-scheduler
    restart: unless-stopped
    command: ["python", "-m", "scheduler.main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - copy .env.example to .env and set your Neon connection string}
      ML_PIPELINE_ROOT: /ml-pipeline
      GEE_PROJECT: ${GEE_PROJECT:-}
    volumes:
      - ./services/aquavision-service/models:/app/models
      - ./services/aquavision-service/data/models:/app/data/models
      - ${GEE_CREDENTIALS_DIR:-C:/Users/haris/.config/earthengine}:/root/.config/earthengine:ro
    depends_on:
      aquavision:
        condition: service_started
    networks:
      - scada-net
    # Scheduler does not serve HTTP; image healthcheck targets :8100.
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q scheduler.main"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
      args:
        # baked into the static export at build time (runtime env does not
        # reach a static bundle); browser on host resolves localhost only
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8100}
    container_name: ibcp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://aquavision:8100
    depends_on:
      - aquavision
    networks:
      - scada-net

volumes:
  ibcp-pgdata:
    external: true

networks:
  scada-net:
    driver: bridge
