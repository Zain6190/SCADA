# Static-export server for the dashboard.
#
# HTML must never be heuristically cached: after a rebuild the browser kept
# the previous document and showed a stale dashboard. `no-cache` still allows
# storing the file but forces revalidation on every visit (cheap 304s via
# ETag/Last-Modified), while the content-hashed /_next/static assets are
# immutable and cached for a year.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js content-hashed assets: safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Any exported page (dir/index.html or page.html).
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location /IBCP-SCADA/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ $uri.html /IBCP-SCADA/index.html;
    }
}
